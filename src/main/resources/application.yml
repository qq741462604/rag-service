minicodex:
  home: D:/ideaProject/AI/LW45.02_rag_service

#目标  D:\ideaProject\target\LW45.07_RT_PfPlugin
codex:
  agent:
    test-generation-enabled: true # S1 完成后按清单生成测试，再统一执行与局部修复
    max-model-calls: 40 # 单任务规划调用上限，确定性模板读取不消耗该预算
    max-repair-rounds: 5 # S2 验证失败后最多修复轮数，允许 0～10
    test-timeout-seconds: 300 # 单次模块测试超时，允许 30～1800 秒
    test-java-home: ${CODEX_TEST_JAVA_HOME:} # 目标工程专用 JDK 根目录，如 D:/tools/Java/jdk-11；不影响生成器 JDK8
  workspace:
