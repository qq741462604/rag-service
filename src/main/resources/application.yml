server:
  port: 8080

spring:
  profiles:
    active: local
  jackson:
    time-zone: GMT+8

embedding:
  api:
    url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
    key: ${LLM_API_KEY}
vector:
  topk: 5
  threshold: 0.60

dashscope:
  api:
    url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings # <- 替换为真实 dashscope embedding URL
    key: ${LLM_API_KEY}  # 推荐用环境变量 DASHSCOPE_API_KEY
model:
  name: "text-embedding-v2"
kb:
  raw-path: "src/main/resources/data/kb.xlsx"
  emb-path: "src/main/resources/data/kb_with_embedding.csv"
  correction-path: "src/main/resources/data/correction.csv"
search:
  desc-weight: 3
  name-weight: 1


#加鉴权
auth:
  enabled: true          # 是否开启鉴权（支持灰度）
  time-window-seconds: 300

  # appId -> appSecret
  app-secrets:
    demo-app: demo-secret-123

  # 不参与鉴权的路径前缀（框架 / 探针 / 运维）
  excluded-path-prefixes:
    - /actuator
    - /health
    - /metrics
    - /probe
    - /prometheus
