# UTF-8。包名前缀=首选 groupId:artifactId|已知可传递提供该包的依赖。
# 不固定版本；优先复用目标 POM、properties、父 POM/BOM 的管理。
# 内部公共包只有确认 Maven 坐标后才能添加映射，不根据 Java 包名猜坐标。
# 配置仅提供候选；以实际 import、已有 JAR 类型证据、目标 JDK/框架版本为准。
# 测试包使用 test scope；注解处理器、Servlet provided/runtime 驱动等仍需核对实际用途。
